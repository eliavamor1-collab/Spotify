name: Build signed Android APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install SDK components
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install "platform-tools" "platforms;android-37" "build-tools;36.1.0" "ndk;30.0.16248370" "cmake;4.1.2"

      - name: Decode signing keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > spotify-release.jks

      - name: Build release APK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          KEYSTORE_PATH: ${{ github.workspace }}/spotify-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew :androidApp:assembleRelease --no-configuration-cache -Pandroid.builder.sdkDownload=true

      - name: Prepare release assets
        id: assets
        run: |
          APK=$(find androidApp/build/outputs/apk/release -maxdepth 1 -name '*.apk' | head -n 1)
          if [ -z "$APK" ]; then echo "No APK found" >&2; exit 1; fi
          cp "$APK" Spotify.apk
          cp "$APK" "Spotify-${{ github.ref_name }}.apk"
          ls -lh Spotify*.apk

      - name: Publish APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Spotify.apk
            Spotify-${{ github.ref_name }}.apk
          generate_release_notes: true
